# ALZA Flow — Supabase CLI project config
# https://supabase.com/docs/guides/local-development/cli/config

[functions.invite-alza-user]
verify_jwt = true

[functions.notify-transaction-review]
verify_jwt = true

[functions.run-reconciliation-matching]
verify_jwt = true

[functions.confirm-reconciliation-receipts]
verify_jwt = true

[functions.create-razorpay-subscription]
verify_jwt = true

[functions.cancel-razorpay-subscription]
verify_jwt = true

# Razorpay sends its own signature; do not require Supabase JWT.
[functions.razorpay-webhook]
verify_jwt = false

[functions.notify-support-event]
verify_jwt = true

# Public prospect signup (creates prospect agency; never auto-activates).
[functions.create-agency-signup]
verify_jwt = false
